<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#efe8d8;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1600), H = +(P.get('h') || 1600);
const BG = P.get('bg') || '#efe8d8';
document.body.style.background = BG;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);

// medidas: caras de 1999 x 1538 px -> base cuadrada; tapa ~500 px de alto
const S = 1 / 1000;
const BW = 1999 * S, BH = 1538 * S, LID = 500 * S;

const loader = new THREE.TextureLoader();
const tex = n => { const t = loader.load('tex/' + n + '.jpg'); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const paper = (map) => new THREE.MeshStandardMaterial({ color: 0xffffff, map: map || null, roughness: 0.82, metalness: 0 });

const box = new THREE.Group(); scene.add(box);

// cuerpo hueco: +x derecho, -x izquierdo, +y arriba (abierto), -y abajo, +z frente, -z atrás
const hidden = new THREE.MeshBasicMaterial({ visible: false });
const body = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BW), [
  paper(tex('derecho')), paper(tex('izquierdo')), hidden, paper(), paper(tex('frente')), paper(tex('detras'))
]);
body.position.y = BH / 2; body.castShadow = true; body.receiveShadow = true; box.add(body);
const inner = new THREE.Mesh(new THREE.BoxGeometry(BW - 0.01, BH - 0.005, BW - 0.01),
  [paper(), paper(), hidden, paper(), paper(), paper()].map(m => { const c = m.clone(); c.side = THREE.BackSide; c.color = new THREE.Color(0xf1eee6); return c; }));
inner.position.y = BH / 2 + 0.003; inner.receiveShadow = true; box.add(inner);

// tapa de una pieza con bisagra en el borde de atrás; al cerrar cae sobre el frente y los costados
const T = 0.012;
const lid = new THREE.Group(); box.add(lid);
lid.position.set(0, BH, -BW / 2 - T); // eje de la bisagra
const lidMat = paper();
const part = (w, h, d, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lidMat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; lid.add(m); };
const LW = BW + 2 * T, LD = BW + 2 * T;
part(LW, T, LD, 0, T / 2, LD / 2);                           // panel superior
part(LW, LID, T, 0, T - LID / 2, LD - T / 2);                // faldón frontal
// solapas laterales: van por dentro de las paredes, solo se ven con la caja abierta
const flapShape = new THREE.Shape(); const FD = BW * 0.92, FH = LID * 0.85;
flapShape.moveTo(0, 0); flapShape.lineTo(FD, 0); flapShape.lineTo(FD - FH * 0.35, -FH); flapShape.lineTo(FH * 0.35, -FH); flapShape.lineTo(0, 0);
const flapGeo = new THREE.ExtrudeGeometry(flapShape, { depth: T * 0.6, bevelEnabled: false });
for (const sx of [-1, 1]) {
  const f = new THREE.Mesh(flapGeo, lidMat); f.castShadow = true;
  f.rotation.y = -Math.PI / 2;
  f.position.set(sx * (BW / 2 - T * 1.2), 0, T + (LD - FD) / 2);
  lid.add(f);
}
const lidBase = 0;

// piso que solo recibe sombra
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.16 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(-3.2, 6.5, 3.2); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 18; key.shadow.blurSamples = 25; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 });
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfbb, 0.9));
const fill = new THREE.DirectionalLight(0xffffff, 0.9); fill.position.set(4, 3, -4); scene.add(fill);

window.setView = ({ az = 35, el = 18, dist = 8.6, lidUp = 0, ty = 1.05 }) => {
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  camera.position.set(Math.sin(a) * Math.cos(e) * dist, ty + Math.sin(e) * dist, Math.cos(a) * Math.cos(e) * dist);
  camera.lookAt(0, ty, 0);
  lid.rotation.x = -THREE.MathUtils.degToRad(lidUp);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
THREE.DefaultLoadingManager.onLoad = () => { window.ready = true; };
</script>
</body></html>
